<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-gradient)" rx="16" />

  <!-- Glowing background circles -->
  <circle cx="200" cy="100" r="300" fill="url(#glow)" />
  <circle cx="1000" cy="300" r="350" fill="url(#glow)" />

  <!-- Decorative Tech Circuit / Grid overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 H 1200 M 0,120 H 1200 M 0,180 H 1200 M 0,240 H 1200 M 0,300 H 1200 M 0,360 H 1200" />
    <path d="M 150,0 V 420 M 300,0 V 420 M 450,0 V 420 M 600,0 V 420 M 750,0 V 420 M 900,0 V 420 M 1050,0 V 420" />
  </g>

  <!-- Connected Graph / SaaS Security Nodes (Background Art) -->
  <g stroke="url(#accent-cyan)" stroke-width="2" opacity="0.4">
    <line x1="150" y1="120" x2="280" y2="80" />
    <line x1="280" y1="80" x2="380" y2="160" />
    <line x1="150" y1="120" x2="220" y2="250" />
    <line x1="220" y1="250" x2="380" y2="160" />

    <line x1="820" y1="260" x2="960" y2="340" />
    <line x1="960" y1="340" x2="1060" y2="240" />
    <line x1="820" y1="260" x2="950" y2="150" />
    <line x1="950" y1="150" x2="1060" y2="240" />
  </g>

  <g fill="#06b6d4" opacity="0.6">
    <circle cx="150" cy="120" r="6" />
    <circle cx="280" cy="80" r="8" />
    <circle cx="380" cy="160" r="5" />
    <circle cx="220" cy="250" r="7" />

    <circle cx="820" cy="260" r="6" />
    <circle cx="960" cy="340" r="8" />
    <circle cx="1060" cy="240" r="5" />
    <circle cx="950" cy="150" r="7" />
  </g>

  <!-- Large Security Shield Badge Graphic on Right -->
  <g transform="translate(920, 80)" filter="url(#shadow)">
    <!-- Outer Hex Shield -->
    <path d="M 90,10 L 170,50 V 130 C 170,195 90,230 90,230 C 90,230 10,195 10,130 V 50 Z" 
          fill="url(#shield-grad)" stroke="#60a5fa" stroke-width="3" />
    <!-- Inner Lock Icon -->
    <path d="M 90,85 C 76.2,85 65,96.2 65,110 V 125 H 60 C 54.5,125 50,129.5 50,135 V 170 C 50,175.5 54.5,180 60,180 H 120 C 125.5,180 130,175.5 130,170 V 135 C 130,129.5 125.5,125 120,125 H 115 V 110 C 115,96.2 103.8,85 90,85 Z M 90,98 C 96.6,98 102,103.4 102,110 V 125 H 78 V 110 C 78,103.4 83.4,98 90,98 Z" 
          fill="#ffffff" />
  </g>

  <!-- Foreground Content: Title & Subtitle (CLEAR & VISIBLE) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 75)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">
        🛡️ CURATED SECURITY ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome SaaS Security &amp;
    </text>
    <text x="0" y="220" fill="url(#accent-cyan)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow-filter)">
      Application Integration
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" width="650">
      Enterprise SSPM • Identity Lifecycle • Open-Source Automation • Policy-as-Code
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 315)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="65" y="22" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔑 Identity SSO</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="150" height="34" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="220" y="22" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ SSPM Posture</text>

      <!-- Tag 3 -->
      <rect x="310" y="0" width="165" height="34" rx="8" fill="#4c1d95" stroke="#c084fc" stroke-width="1" />
      <text x="392" y="22" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔄 SaaS Workflows</text>
    </g>
  </g>
</svg>
